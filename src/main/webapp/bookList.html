<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图书列表</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>图书列表</h2>
        <button class="btn btn-danger" onclick="logout()">退出登录</button>
    </div>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>书名</th>
            <th>作者</th>
            <th>出版社</th>
            <th>库存</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="bookTable"></tbody>
    </table>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $(function() {
        loadBooks();
    });

    function loadBooks() {
        $.ajax({
            url: "/api/books",
            type: "GET",
            xhrFields: {withCredentials: true},
            success: function(res) {
                let html = "";
                res.data.forEach(book => {
                    html += `
                        <tr>
                            <td>${book.id}</td>
                            <td>${book.name}</td>
                            <td>${book.author}</td>
                            <td>${book.publisher}</td>
                            <td>${book.stock}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="borrow(${book.id})">借阅</button>
                            </td>
                        </tr>
                    `;
                });
                $("#bookTable").html(html);
            }
        });
    }

    function borrow(bookId) {
        $.ajax({
            url: `/api/borrow/${bookId}`,
            type: "POST",
            xhrFields: {withCredentials: true},
            success: function(res) {
                alert(res.msg);
                if (res.success) loadBooks();
            }
        });
    }

    function logout() {
        $.get("/api/user/logout", {withCredentials: true}, function() {
            location.href = "login.html";
        });
    }
</script>
</body>
</html>
