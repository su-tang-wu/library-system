<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图书查询系统 - 用户</title>
    <link rel="stylesheet"
          href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        .user-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .book-card {
            transition: transform 0.2s;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: 100%;
        }
        .book-card:hover {
            transform: translateY(-5px);
        }
        .stock-indicator {
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 12px;
        }
        .search-box {
            max-width: 500px;
            margin: 0 auto 30px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <!-- 用户专属头部 -->
    <div class="user-header">
        <h1><i class="fas fa-book-reader"></i> 图书查询系统</h1>
        <p class="lead mb-3">欢迎来到在线图书馆，这里可以浏览所有可借阅的图书</p>
        <div class="d-flex justify-content-center align-items-center">
            <span class="badge bg-light text-dark me-3">
                <i class="fas fa-user"></i> 读者模式
            </span>
            <button class="btn btn-light" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> 退出登录
            </button>
        </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="搜索图书名称、作者或分类...">
            <button class="btn btn-primary" onclick="searchBooks()">
                <i class="fas fa-search"></i> 搜索
            </button>
        </div>
    </div>

    <!-- 图书展示区域 -->
    <div id="loadingSection" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-2">正在加载图书数据...</p>
    </div>

    <!-- 卡片视图 -->
    <div id="cardView" class="row" style="display: none;">
        <!-- 图书卡片会动态加载到这里 -->
    </div>

    <!-- 表格视图 -->
    <div id="tableView" class="card mt-4" style="display: none;">
        <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-table"></i> 图书列表</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>书名</th>
                        <th>作者</th>
                        <th>出版社</th>
                        <th>库存状态</th>
                        <th>分类</th>
                    </tr>
                    </thead>
                    <tbody id="bookTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 空数据提示 -->
    <div id="emptyData" class="text-center" style="display: none;">
        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i> 暂无图书数据
        </div>
    </div>

    <!-- 视图切换按钮 -->
    <div class="text-center mt-3" id="viewSwitch" style="display: none;">
        <div class="btn-group">
            <button class="btn btn-outline-primary active" onclick="switchView('card')">
                <i class="fas fa-th"></i> 卡片视图
            </button>
            <button class="btn btn-outline-primary" onclick="switchView('table')">
                <i class="fas fa-list"></i> 表格视图
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>

<script>
    let allBooks = [];
    let currentView = 'card';

    // 页面加载完成后执行
    $(document).ready(function() {
        console.log('页面加载完成，开始检查登录状态...');
        checkLoginAndLoadBooks();
    });

    // 检查登录状态并加载图书
    function checkLoginAndLoadBooks() {
        const token = localStorage.getItem('token');

        if (!token) {
            console.log('未检测到token，以游客身份加载图书');
            loadBooks();
            return;
        }

        // 检查用户角色
        $.ajax({
            url: "/api/user/check",
            type: "GET",
            headers: { 'Authorization': `Bearer ${token}` },
            success: function(res) {
                console.log('用户角色:', res.role);
                if (res.role === 'admin') {
                    // 如果是管理员，跳转到管理员页面
                    console.log('检测到管理员权限，跳转到管理员页面');
                    window.location.href = 'adminBook.html';
                } else {
                    // 普通用户，加载图书
                    loadBooks();
                }
            },
            error: function(xhr) {
                console.log('token验证失败，以游客身份加载图书');
                localStorage.removeItem('token');
                loadBooks();
            }
        });
    }

    // 加载图书数据
    function loadBooks() {
        console.log('开始加载图书数据...');
        const token = localStorage.getItem('token');

        $.ajax({
            url: "/api/books",
            type: "GET",
            headers: token ? { 'Authorization': `Bearer ${token}` } : {},
            success: function(res) {
                console.log('图书数据加载成功:', res);
                // 处理不同格式的响应数据
                allBooks = Array.isArray(res) ? res : (res.data || res.books || []);

                if (allBooks.length === 0) {
                    showEmptyData();
                } else {
                    showData();
                    renderBookCards(allBooks);
                    renderBookTable(allBooks);
                    switchView('card');
                }
            },
            error: function(xhr, status, error) {
                console.error('图书数据加载失败:', error);
                showError('加载失败，请刷新页面重试');
            }
        });
    }

    // 显示空数据提示
    function showEmptyData() {
        $('#loadingSection').hide();
        $('#cardView').hide();
        $('#tableView').hide();
        $('#viewSwitch').hide();
        $('#emptyData').show();
    }

    // 显示数据区域
    function showData() {
        $('#loadingSection').hide();
        $('#emptyData').hide();
        $('#viewSwitch').show();
    }

    // 显示错误信息
    function showError(message) {
        $('#loadingSection').html(`
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i> ${message}
            </div>
        `);
    }

    // 渲染卡片视图
    function renderBookCards(books) {
        let html = '';
        books.forEach(book => {
            const stockStatus = getStockStatus(book.stock);
            const statusText = getStatusText(book.stock);

            html += `
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card book-card">
                    <div class="card-body">
                        <h5 class="card-title text-truncate" title="${book.name}">${book.name || '未知书名'}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">${book.author || '未知作者'}</h6>
                        <p class="card-text">
                            <small class="text-muted">
                                <i class="fas fa-building"></i> ${book.publisher || '未知出版社'}
                            </small>
                        </p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="badge bg-secondary">${book.category || '未分类'}</span>
                            <span class="stock-indicator bg-${stockStatus} text-white">
                                <i class="fas fa-copy"></i> ${book.stock || 0}本 (${statusText})
                            </span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent">
                        <small class="text-muted">图书ID: ${book.id || 'N/A'}</small>
                    </div>
                </div>
            </div>`;
        });

        $('#cardView').html(html);
    }

    // 渲染表格视图
    function renderBookTable(books) {
        let html = "";
        books.forEach(book => {
            const stockStatus = getStockStatus(book.stock);
            const statusText = getStatusText(book.stock);

            html += `
            <tr>
                <td>${book.id || 'N/A'}</td>
                <td><strong>${book.name || '未知书名'}</strong></td>
                <td>${book.author || '未知作者'}</td>
                <td>${book.publisher || '未知出版社'}</td>
                <td>
                    <span class="badge bg-${stockStatus}">${book.stock || 0}本 (${statusText})</span>
                </td>
                <td><span class="badge bg-secondary">${book.category || '未分类'}</span></td>
            </tr>`;
        });

        $('#bookTableBody').html(html);
    }

    // 获取库存状态
    function getStockStatus(stock) {
        stock = stock || 0;
        if (stock > 10) return 'success';
        if (stock > 5) return 'warning';
        return 'danger';
    }

    // 获取状态文本
    function getStatusText(stock) {
        stock = stock || 0;
        if (stock > 10) return '充足';
        if (stock > 5) return '紧张';
        return '紧缺';
    }

    // 切换视图
    function switchView(viewType) {
        currentView = viewType;

        // 更新按钮状态
        $('.btn-group .btn').removeClass('active');
        $(`.btn:contains(${viewType === 'card' ? '卡片视图' : '表格视图'})`).addClass('active');

        // 切换视图显示
        if (viewType === 'card') {
            $('#tableView').hide();
            $('#cardView').show();
        } else {
            $('#cardView').hide();
            $('#tableView').show();
        }
    }

    // 搜索图书
    function searchBooks() {
        const keyword = $('#searchInput').val().toLowerCase().trim();

        if (!keyword) {
            // 如果搜索框为空，显示所有图书
            renderBookCards(allBooks);
            renderBookTable(allBooks);
            switchView(currentView);
            return;
        }

        // 过滤图书
        const filteredBooks = allBooks.filter(book => {
            const name = (book.name || '').toLowerCase();
            const author = (book.author || '').toLowerCase();
            const category = (book.category || '').toLowerCase();
            const publisher = (book.publisher || '').toLowerCase();

            return name.includes(keyword) ||
                author.includes(keyword) ||
                category.includes(keyword) ||
                publisher.includes(keyword);
        });

        if (filteredBooks.length === 0) {
            $('#cardView').html(`
                <div class="col-12 text-center">
                    <div class="alert alert-warning">
                        <i class="fas fa-search"></i> 没有找到匹配的图书
                    </div>
                </div>
            `);
            $('#bookTableBody').html(`
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        <i class="fas fa-search"></i> 没有找到匹配的图书
                    </td>
                </tr>
            `);
        } else {
            renderBookCards(filteredBooks);
            renderBookTable(filteredBooks);
        }

        // 确保切换到卡片视图进行搜索结果显示
        switchView('card');
    }

    // 退出登录
    function logout() {
        localStorage.removeItem('token');
        window.location.href = "login.html";
    }

    // 回车键搜索
    $('#searchInput').on('keypress', function(e) {
        if (e.which === 13) {
            searchBooks();
        }
    });
</script>
</body>
</html>
