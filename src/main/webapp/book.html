<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图书管理</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>图书管理</h2>
        <button class="btn btn-danger" onclick="logout()">退出登录</button>
    </div>
    <button class="btn btn-success mb-3" onclick="showAddModal()">新增图书</button>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>书名</th>
            <th>作者</th>
            <th>出版社</th>
            <th>库存</th>
            <th>分类</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="bookTable"></tbody>
    </table>
</div>

<!-- 新增/编辑模态框 -->
<div class="modal" id="bookModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">新增图书</h5>
                <button type="button" class="btn-close" onclick="closeModal()"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="bookId">
                <div class="mb-3">
                    <label class="form-label">书名 *</label>
                    <input type="text" id="name" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">作者 *</label>
                    <input type="text" id="author" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">出版社</label>
                    <input type="text" id="publisher" class="form-control">
                </div>
                <div class="mb-3">
